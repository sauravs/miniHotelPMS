# CI is the mechanical form of the gate in docs/plan.md: a slice does not merge
# until its tests are green. Required on every pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (zoneinfo, StrEnum, tomllib); 3.13 is what we develop on.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the slice-15 guard can diff against origin/main. With the
          # default depth of 1 there is no merge base, and the guard fails loudly rather
          # than standing down (tests/unit/test_slice15_engine_untouched.py).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        # The engine needs none. These are the test runner and the coverage tool, and
        # they are pinned exactly so a CI green means the same thing next month.
        run: python -m pip install -r requirements-dev.txt

      - name: Run the suite
        # PYTHONDONTWRITEBYTECODE is not hygiene, it is a correctness gate. v1
        # recorded two occasions where an edit changed neither a file's size nor
        # its mtime-second, leaving a stale .pyc valid - so the suite ran the OLD
        # code and reported a green that meant nothing.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m coverage run -m pytest

      - name: Coverage floor
        run: python -m coverage report

      - name: Validate spec and fixtures
        # No-op until slice 1 lands the validator; wired now so the gate exists
        # before there is anything to sneak past it.
        run: |
          if [ -f tools/validate_spec.py ]; then
            python -m tools.validate_spec
          else
            echo "spec validator arrives in slice 1 - skipping"
          fi

  # The React UI (slice 15). A SEPARATE job with no `needs:` in either direction, and not one of
  # the two checks `main` requires: a broken npm, a registry outage or a browser download must
  # never block an engine fix. The rules that matter most about ui/ - no parsing money, no PMS
  # identifier, no injected HTML, one module that makes requests, exact pins - are ALSO checked
  # by the required Python suite (tests/unit/test_ui_hygiene.py), so they cannot be skipped.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install, exactly as locked
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Component tests and the parity harness, from the golden payloads
        run: npm test

      - name: Build
        run: npm run build

      - name: Real-browser tests (computed styles, keyboard, axe)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
